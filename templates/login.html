{% extends "base.html" %}

{% block title %}Login - Nivea Health Care{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Login</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                    
                    <hr class="my-3">
                    
                    <p class="text-center mb-2">Don't have an account?</p>
                    <a href="{{ url_for('auth.register') }}" class="btn btn-outline-secondary w-100">Create Account</a>
                    
                    <div class="alert alert-info mt-3 mb-0">
                        <small><strong>Test Login:</strong> admin / admin123</small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
